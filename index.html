<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAER — Encerramento</title>

    <style>
        @font-face {
            font-family: "Gontserrat";
            src: url('https://raw.githubusercontent.com/zaerAI/zaer.src/main/ZAER/public/assets/fonts/Gontserrat-Regular.ttf')
                format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Gontserrat', Arial, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            padding: 40px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .header-section {
            text-align: center;
            padding: 48px 32px;
            background: #fff;
            border-radius: 8px;
        }

        .logo {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 40px;
        }

        .logo img {
            display: block;
            width: 100%;
            height: auto;
        }

        h1 {
            font-size: clamp(26px, 5vw, 38px);
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        .description {
            max-width: 600px;
            margin: 0 auto 24px;
            font-size: clamp(16px, 2.5vw, 19px);
            line-height: 1.8;
            color: #555;
        }

        .thank-you {
            font-size: clamp(16px, 2.5vw, 18px);
            line-height: 1.8;
            color: #777;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: #000;
            margin: 32px auto;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: #999;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 12px;
            }

            .header-section {
                padding: 36px 20px;
            }

            .logo {
                max-width: 300px;
                margin-bottom: 32px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="header-section">

            <div class="logo">
                <img
                    src="https://zaerai.github.io/chat/assets/images/logoBlack.png"
                    alt="Logo ZaerAI"
                >
            </div>

            <h1>
                A ZaerAI finalizou suas atividades em 28/10/2026.
            </h1>

            <div class="divider"></div>

            <p class="description">
                Agradecemos a todos que usufruíram deste projeto!
            </p>

            <p class="thank-you">
                Obrigado por fazer parte da nossa história.
            </p>

        </section>

        <footer class="footer">
            ZaerAI · 2026
        </footer>
    </main>
</body>
</html>
